<app-navbar></app-navbar>

<section
  class="min-h-screen flex items-center justify-center bg-gradient-to-b from-primary-50 to-surface-0 dark:from-surface-900 dark:to-surface-900 p-6"
>
  <div
    class="w-full max-w-md bg-surface-0 dark:bg-surface-900 rounded-2xl shadow-lg p-8 flex flex-col gap-6"
  >
    <div class="flex flex-col items-center gap-2 text-center">
      <span
        class="pi pi-sign-in text-4xl p-3 rounded-full bg-primary-100 text-primary-600"
      ></span>
      <h2 class="text-2xl font-bold">Connexion</h2>
      <p class="text-surface-600 dark:text-surface-300">
        Accédez à votre tableau de bord MesAbos
      </p>
    </div>

    <div *ngIf="error" class="p-3 bg-red-100 text-red-700 rounded">
      {{ error }}
    </div>

    <form (ngSubmit)="submit()" #form="ngForm" class="flex flex-col gap-4">
      <div class="flex flex-col gap-2">
        <label for="email" class="font-medium">Email</label>
        <div class="p-inputgroup w-full">
          <span class="p-inputgroup-addon">
            <i class="pi pi-envelope"></i>
          </span>
          <input
            pInputText
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            required
            class="w-full"
          />
        </div>
      </div>

      <div class="flex flex-col gap-2">
        <div class="flex justify-between">
          <label for="password" class="font-medium">Mot de passe</label>
          <a
            routerLink="/reset-password"
            class="text-sm text-primary hover:underline"
            >Mot de passe oublié&nbsp;?</a
          >
        </div>
        <div class="p-inputgroup w-full">
          <span class="p-inputgroup-addon">
            <i class="pi pi-lock"></i>
          </span>
          <p-password
            inputId="password"
            name="password"
            [(ngModel)]="password"
            [feedback]="false"
            toggleMask
            inputStyleClass="w-full"
            class="w-full"
            required
          ></p-password>
        </div>
      </div>

      <button
        pButton
        type="submit"
        label="Se connecter"
        class="w-full p-button-lg mt-2"
      ></button>
    </form>

    <p-divider align="center">Ou continuer avec</p-divider>

    <div class="flex justify-center gap-4">
      <button
        pButton
        type="button"
        class="p-button-rounded p-button-outlined"
        icon="pi pi-google"
      ></button>
      <button
        pButton
        type="button"
        class="p-button-rounded p-button-outlined"
        icon="pi pi-facebook"
      ></button>
      <button
        pButton
        type="button"
        class="p-button-rounded p-button-outlined"
        icon="pi pi-apple"
      ></button>
    </div>
  </div>
</section>
