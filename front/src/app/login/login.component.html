<app-navbar></app-navbar>

<main id="main-content" role="main">
  <section
    class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-50 via-surface-0 to-primary-100 dark:from-surface-900 dark:to-surface-800 p-6"
  >
    <div
      class="login-container form-container w-full max-w-md bg-surface-0/90 dark:bg-surface-900/90 rounded-3xl shadow-2xl p-8 flex flex-col gap-6"
    >
      <div class="flex flex-col items-center gap-4 text-center">
        <div
          class="w-20 h-20 rounded-full bg-gradient-to-br from-primary-500 to-primary-600 flex items-center justify-center shadow-lg"
        >
          <i class="pi pi-sign-in text-3xl text-white"></i>
        </div>
        <div>
          <h2 class="text-3xl font-bold text-gray-800 dark:text-white mb-2">
            Bienvenue !
          </h2>
          <p class="text-surface-600 dark:text-surface-300">
            Connectez-vous à votre compte MesAbos
          </p>
        </div>
      </div>

      <div
        *ngIf="error"
        class="error-message p-4 bg-red-100 text-red-700 rounded-xl border border-red-200"
      >
        <div class="flex items-center gap-2">
          <i class="pi pi-exclamation-triangle"></i>
          <span>{{ error }}</span>
        </div>
      </div>

      <form (ngSubmit)="submit()" #form="ngForm" class="flex flex-col gap-6">
        <div class="flex flex-col gap-3">
          <label
            for="email"
            class="font-semibold text-gray-700 dark:text-gray-300"
          >
            Adresse email
          </label>
          <div class="p-inputgroup w-full">
            <span class="p-inputgroup-addon">
              <i class="pi pi-envelope"></i>
            </span>
            <input
              pInputText
              id="email"
              name="email"
              type="email"
              [(ngModel)]="email"
              required
              placeholder="votre@email.com"
              class="w-full"
            />
          </div>
        </div>

        <div class="flex flex-col gap-3">
          <div class="flex justify-between items-center">
            <label
              for="password"
              class="font-semibold text-gray-700 dark:text-gray-300"
            >
              Mot de passe
            </label>
            <a
              routerLink="/reset-password"
              class="text-sm text-primary hover:text-primary-600 hover:underline transition-colors"
            >
              Oublié ?
            </a>
          </div>
          <div class="p-inputgroup w-full">
            <span class="p-inputgroup-addon">
              <i class="pi pi-lock"></i>
            </span>
            <p-password
              inputId="password"
              name="password"
              [(ngModel)]="password"
              [feedback]="false"
              toggleMask
              placeholder="••••••••"
              inputStyleClass="w-full"
              styleClass="w-full"
              required
            ></p-password>
          </div>
        </div>

        <button
          pButton
          type="submit"
          label="Se connecter"
          icon="pi pi-sign-in"
          class="login-button w-full p-4 text-lg font-semibold mt-2"
          [disabled]="!form.valid"
        ></button>

        <div class="text-center">
          <p class="text-surface-600 dark:text-surface-300 text-sm">
            Pas encore de compte ?
            <a
              routerLink="/register"
              class="text-primary font-semibold hover:text-primary-600 hover:underline transition-colors ml-1"
            >
              Créer un compte gratuitement
            </a>
          </p>
        </div>
      </form>

      <p-divider align="center" class="my-2">
        <span class="text-surface-500 text-sm px-3">Ou continuer avec</span>
      </p-divider>

      <div class="flex justify-center">
        <div id="googleBtn" class="google-btn"></div>
      </div>

      <div
        class="text-center pt-4 border-t border-surface-200 dark:border-surface-700"
      >
        <p class="text-xs text-surface-500 leading-relaxed">
          En vous connectant, vous acceptez nos
          <a href="#" class="text-primary hover:underline"
            >Conditions d'utilisation</a
          >
          et notre
          <a href="#" class="text-primary hover:underline"
            >Politique de confidentialité</a
          >
        </p>
      </div>
    </div>
  </section>
</main>
