<!-- src/app/shared/navbar/navbar.component.html -->
<nav
  class="bg-surface-0 dark:bg-surface-900 w-full border-b border-surface-200 dark:border-surface-700"
>
  <div class="max-w-7xl mx-auto flex items-center justify-between px-6 py-4">
    <!-- Logo -->
    <a routerLink="/" class="text-2xl font-bold tracking-tight"> mesAbos </a>

    <!-- Liens vers les sections (ancre) -->
    <ul class="hidden md:flex items-center gap-8 font-medium">
      <li><a href="#hero" class="hover:text-primary">Accueil</a></li>
      <li>
        <a href="#features" class="hover:text-primary">Fonctionnalités</a>
      </li>
      <li><a href="#pricing" class="hover:text-primary">Tarifs</a></li>
      <li><a href="#contact" class="hover:text-primary">Contact</a></li>
    </ul>

    <!-- Menu utilisateur / connexion -->
    @if (isLoggedIn()) {
      <div class="flex items-center gap-3">
        <p-menu #userMenu [model]="userItems" [popup]="true"></p-menu>
        <a
          routerLink="/profile"
          class="inline-flex h-10 w-10 overflow-hidden rounded-full border border-surface-300 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/60"
          [attr.aria-label]="'Ouvrir le profil de ' + profileLabel()"
          [attr.title]="profileLabel()"
        >
          <img
            [ngSrc]="avatarUrl()"
            [attr.alt]="avatarAlt()"
            width="40"
            height="40"
            class="h-full w-full object-cover"
            priority
          />
        </a>
        <button
          pButton
          type="button"
          icon="pi pi-ellipsis-v"
          class="p-button-text p-button-sm md:p-button-md"
          (click)="userMenu.toggle($event)"
          aria-label="Ouvrir le menu utilisateur"
        ></button>
      </div>
    } @else {
      <button
        pButton
        label="Connexion"
        class="p-button-sm md:p-button-md"
        routerLink="/login"
      ></button>
    }

    <!-- Burger mobile -->
    <p-menubar class="md:hidden" [model]="mobileItems" #menu>
      <ng-template pTemplate="start">
        <button
          pButton
          icon="pi pi-bars"
          class="p-button-text"
          (click)="menu.toggle($event)"
        ></button>
      </ng-template>
    </p-menubar>
  </div>
</nav>
